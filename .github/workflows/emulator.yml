name: Android emulator test

on:
  workflow_dispatch:
    inputs:
      api_levels:
        description: "JSON array of API levels"
        required: true
        default: "[28,29,30,31,32,33,34,35]"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        api_level: ${{ fromJSON(inputs.api_levels) }}
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Run emulator tests (API ${{ matrix.api_level }})
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api_level }}
          target: default
          arch: x86_64
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
            -camera-back none -camera-front none
          script: bash ci/emulator-test.sh

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-api-${{ matrix.api_level }}
          path: |
            screenshot.png
            logcat.txt
            device_policy.txt
            package.txt
            help.txt
          if-no-files-found: ignore
